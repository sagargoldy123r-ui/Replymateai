name: Build ReplyMate AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -lah
          echo ""
          echo "Checking ReplyMateAI-v1.1.zip..."
          test -f ReplyMateAI-v1.1.zip
          echo "ZIP file found successfully."

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q ReplyMateAI-v1.1.zip -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -100

      - name: Detect project folder
        run: |
          echo "Searching for Gradle project..."

          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "Gradle project found directly in project/"
          elif [ -f "project/ReplyMateAI-v1.1/settings.gradle" ] || [ -f "project/ReplyMateAI-v1.1/settings.gradle.kts" ]; then
            echo "Gradle project found inside project/ReplyMateAI-v1.1/"
            mv project/ReplyMateAI-v1.1/* project/
            mv project/Reply
